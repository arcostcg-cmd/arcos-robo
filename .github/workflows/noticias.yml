name: Sistema de Noticias - noticias e rumores
on:
  schedule:
    - cron: "30 */4 * * *"   # a cada 4 horas (6 por dia), para caber no plano grátis privado
  workflow_dispatch: {}
concurrency:
  group: robo-noticias
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  noticias:
    # Só roda sozinho depois de ligar a variável ROBO_ATIVO=true (Settings > Secrets and variables > Actions > Variables)
    if: vars.ROBO_ATIVO == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Testes (se falhar, nada é postado)
        run: python arcos.py testes
      - name: Configurar git
        run: |
          git config user.name "robo-tcg"
          git config user.email "robo-tcg@users.noreply.github.com"
      - name: Ler fontes, resumir e montar stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python arcos.py noticias preparar
          git add -A
          git diff --cached --quiet || git commit -m "noticias preparadas"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done
          sleep 60
      - name: Postar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python arcos.py noticias publicar
      - name: Salvar o que foi postado
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "noticias postadas"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*7)); done
