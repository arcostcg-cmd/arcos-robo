name: Teste - chave do Gemini
on:
  push:
    paths: ["pedidos/teste-gemini.txt"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os, time, requests
          k = os.environ["GEMINI_API_KEY"]
          ms = requests.get("https://generativelanguage.googleapis.com/v1beta/models", params={"key": k, "pageSize": 200}).json()["models"]
          nomes = [m["name"].split("/")[-1] for m in ms if "generateContent" in m.get("supportedGenerationMethods", []) and ("flash" in m["name"] or "gemma" in m["name"])]
          print("MODELOS:", nomes)
          for n in nomes[:14]:
              t = time.time()
              try:
                  r = requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{n}:generateContent", params={"key": k}, timeout=60,
                      json={"contents": [{"parts": [{"text": "Traduza para português, só a tradução: New set revealed today."}]}]})
                  txt = r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()[:60] if r.ok else r.text[:80]
              except Exception as e:
                  txt = type(e).__name__
              print(f"TEMPO {n}: {time.time()-t:.1f}s | {txt}")
          PY
