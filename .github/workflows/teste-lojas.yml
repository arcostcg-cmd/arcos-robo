name: Teste - ler preços das lojas
on:
  push:
    paths: ["pedidos/teste-lojas.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  lojas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pillow
      - name: Ler cada oferta cadastrada (sem postar nada)
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import time, yaml, bot, marketplaces
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          lojas = {l["id"]: l for l in cfg["lojas"] if l.get("aprovada")}
          tok = marketplaces.ml_token()
          print(f"Mercado Livre: token oficial {'OK' if tok else 'FALHOU ' + marketplaces.ULTIMO_ERRO_TOKEN['msg']}\n")
          print("| Produto | Loja | Resultado |\n|---|---|---|")
          for p in cfg["produtos"]:
              for o in p["ofertas"]:
                  if o["loja"] not in lojas or lojas[o["loja"]].get("coleta_automatica") is False:
                      continue
                  loja = lojas[o["loja"]]
                  termo = None
                  if loja.get("api") in marketplaces.AGUARDANDO_CHAVE:
                      print(f"| {p['nome'][:55]} | {loja['nome']} | aguardando chave do programa de afiliados |")
                      continue
                  if loja.get("api") == "mercadolivre":
                      r, erro = marketplaces.ml_oferta(o["url"], loja)
                      res = r[:3] if r else None
                      if r:
                          erro = None
                          print(f"| {p['nome'][:55]} | {loja['nome']} | R$ {r[0]:.2f} · {r[4]} · {r[5]} |")
                          continue
                      termo = bot.termo_suspeito(cfg, r[3]) if r else None
                  else:
                      html, erro = bot.baixar_pagina(o["url"], tentativas=2)
                      res = bot.extrair_oferta(html) if html else None
                      termo = bot.termo_suspeito(cfg, bot.extrair_nome(html)) if html else None
                  if res:
                      preco, est, img = res
                      txt = f"R$ {preco:.2f} · {'em estoque' if est else 'sem estoque/pré-venda'}" + (f" · ⚠ termo '{termo}'" if termo else "")
                  else:
                      txt = f"FALHOU: {erro or 'preço não encontrado'}"
                  print(f"| {p['nome'][:55]} | {lojas[o['loja']]['nome']} | {txt} |")
                  time.sleep(2)
          PY
          mkdir -p amostras && cp "$GITHUB_STEP_SUMMARY" amostras/teste-lojas.md || true
          git config user.name "robo-tcg"; git config user.email "robo-tcg@users.noreply.github.com"
          git add amostras && git commit -m "resultado do teste de lojas" && (for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done) || echo "nada novo"
