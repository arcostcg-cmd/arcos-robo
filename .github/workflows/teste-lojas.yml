name: Teste - ler preços das lojas
on:
  workflow_dispatch: {}
jobs:
  lojas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pillow
      - name: Ler cada oferta cadastrada (sem postar nada)
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import time, yaml, bot
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          lojas = {l["id"]: l for l in cfg["lojas"] if l.get("aprovada")}
          print("| Produto | Loja | Resultado |\n|---|---|---|")
          for p in cfg["produtos"]:
              for o in p["ofertas"]:
                  if o["loja"] not in lojas:
                      continue
                  html, erro = bot.baixar_pagina(o["url"], tentativas=2)
                  res = bot.extrair_oferta(html) if html else None
                  termo = bot.termo_suspeito(cfg, bot.extrair_nome(html)) if html else None
                  if res:
                      preco, est, img = res
                      txt = f"R$ {preco:.2f} · {'em estoque' if est else 'sem estoque/pré-venda'}" + (f" · ⚠ termo '{termo}'" if termo else "")
                  else:
                      txt = f"FALHOU: {erro or 'preço não encontrado'}"
                  print(f"| {p['nome'][:55]} | {lojas[o['loja']]['nome']} | {txt} |")
                  time.sleep(2)
          PY
