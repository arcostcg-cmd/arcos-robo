name: Teste - mensagem no canal do Telegram
on:
  workflow_dispatch: {}
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pillow
      - name: Testes automáticos
        run: python arcos.py testes
      - name: Mandar a mensagem de boas-vindas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import yaml, publicar
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          publicar.telegram_texto(cfg, (
              "🔥 Bem-vindo ao Arcos TCG!\n\n"
              "Aqui você encontra promoções de Pokémon, Magic, One Piece, Yu-Gi-Oh!, Lorcana e mais.\n\n"
              "✅ Só lojas verificadas\n"
              "💰 Preço conferido antes de postar\n"
              "🎟️ Cupons testados\n"
              "📰 Notícias e rumores (rumor sempre marcado)\n\n"
              "Ative as notificações 🔔 para não perder nenhuma oferta.\n"
              "Instagram: instagram.com/arcostcg"))
          print("Mensagem enviada ao canal", cfg["telegram"]["canal"])
          PY
