name: Post manual de oferta (aprovado pelo Marcos)
on:
  push:
    paths: ["pedidos/post-manual.json"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Postar no canal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import json, yaml, bot, publicar
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          o = json.load(open("pedidos/post-manual.json", encoding="utf-8"))
          # regra do Marcos: toda promoção vai com a foto do produto do site da loja
          if not o.get("imagem"):
              raise SystemExit("pedido sem 'imagem': promoção só sai com a foto do produto")
          # notícia: legenda pronta; promoção: formato padrão de oferta
          texto = o["legenda"] if o.get("legenda") else bot.texto_telegram(o)
          print(texto)
          import os, requests
          r = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendPhoto",
                            timeout=60, data={"chat_id": cfg["telegram"]["canal"], "photo": o["imagem"],
                                              "caption": texto, "parse_mode": "HTML"})
          print(r.status_code, r.text[:300]); r.raise_for_status()
          print("Enviado ao canal", cfg["telegram"]["canal"])
          PY
