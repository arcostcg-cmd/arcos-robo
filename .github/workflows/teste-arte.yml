name: Teste - arte com carta oficial
on:
  workflow_dispatch:
    inputs:
      imagem:
        description: "Link da imagem OFICIAL da carta"
        required: true
      titulo:
        description: "Título"
        required: true
      credito:
        description: "Crédito da imagem"
        default: "The Pokémon Company (pokemon.com)"
      jogo:
        description: "Jogo"
        default: "Pokémon"
      nome:
        description: "Nome do arquivo"
        default: "amostra"
permissions:
  contents: write
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pillow
      - name: Gerar arte (não posta nada)
        env:
          IMG: ${{ inputs.imagem }}
          TITULO: ${{ inputs.titulo }}
          CREDITO: ${{ inputs.credito }}
          JOGO: ${{ inputs.jogo }}
          NOME: ${{ inputs.nome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import carrossel, noticias
          carta = noticias.imagem_oficial({"link": "", "imagem": os.environ["IMG"]}, {"tipo": "oficial"})
          assert carta is not None, "não consegui baixar a imagem oficial"
          p = Path("amostras"); p.mkdir(exist_ok=True)
          n, t, c, j = os.environ["NOME"], os.environ["TITULO"], os.environ["CREDITO"], os.environ["JOGO"]
          for s in (1, 2):
              carrossel.arte_carta_story(carta, t, j, c, semente=n + str(s)).save(p / f"{n}-story-{s}.jpg", quality=90)
          carrossel.arte_carta_post(carta, t, j, c, semente=n).save(p / f"{n}-post.jpg", quality=90)
          print("ok", carta.size)
          PY
          git config user.name "robo-tcg"; git config user.email "robo-tcg@users.noreply.github.com"
          git add amostras && git commit -m "amostra de arte: $NOME" && git push || echo "nada novo"
