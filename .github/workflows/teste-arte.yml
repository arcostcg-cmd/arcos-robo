name: Teste - arte com carta oficial
on:
  push:
    paths: ["pedidos/arte.json"]
  workflow_dispatch:
    inputs:
      imagem:
        description: "Link da imagem OFICIAL da carta"
        required: true
      titulo:
        description: "Título"
        required: true
      credito:
        description: "Crédito da imagem"
        default: "The Pokémon Company (pokemon.com)"
      jogo:
        description: "Jogo"
        default: "Pokémon"
      nome:
        description: "Nome do arquivo"
        default: "amostra"
permissions:
  contents: write
jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Gerar arte (não posta nada)
        env:
          IMG: ${{ inputs.imagem }}
          TITULO: ${{ inputs.titulo }}
          CREDITO: ${{ inputs.credito }}
          JOGO: ${{ inputs.jogo }}
          NOME: ${{ inputs.nome }}
          EVENTO: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import carrossel, noticias
          if os.environ.get("EVENTO") == "push":
              os.environ.update({k.upper(): v for k, v in json.load(open("pedidos/arte.json", encoding="utf-8")).items()})
          carta = noticias.imagem_oficial({"link": "", "imagem": os.environ.get("IMAGEM") or os.environ["IMG"]}, {"tipo": "oficial"})
          assert carta is not None, "não consegui baixar a imagem oficial"
          p = Path("amostras"); p.mkdir(exist_ok=True)
          n, t, c, j = os.environ["NOME"], os.environ["TITULO"], os.environ["CREDITO"], os.environ["JOGO"]
          for s in (1, 2):
              carrossel.arte_carta_story(carta, t, j, c, semente=n + str(s)).save(p / f"{n}-story-{s}.jpg", quality=90)
          carrossel.arte_carta_post(carta, t, j, c, semente=n).save(p / f"{n}-post.jpg", quality=90)
          print("ok", carta.size)
          PY
          git config user.name "robo-tcg"; git config user.email "robo-tcg@users.noreply.github.com"
          git add amostras && git commit -m "amostra de arte" && (for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done) || echo "nada novo"
