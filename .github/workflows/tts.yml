name: Voz - narração (Gemini TTS)
on:
  push:
    paths: ["pedidos/tts/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tts_gemini.py
      - run: |
          git config user.name "montop-bot"; git config user.email "bot@users.noreply.github.com"
          git add videos/audio || true
          git diff --cached --quiet || (git commit -m "Narração gerada (Gemini TTS)" && git pull --rebase && git push)
