name: Segurança - varredura
on:
  push:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 6h17 (Brasília)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pip-audit==2.9.0 bandit==1.8.6
      - name: Tokens vazados, workflows perigosos, arquivos proibidos
        run: python seguranca.py
      - name: Senhas e tokens em TODO o histórico do git (não só nos arquivos de hoje)
        run: |
          git log -p --all | grep -E -o '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|AIza[0-9A-Za-z_-]{35}|EAA[A-Za-z0-9]{60,}|gh[pousr]_[A-Za-z0-9]{36,}' | sort -u > achados.txt || true
          if [ -s achados.txt ]; then echo "🚨 segredo encontrado no histórico do git (troque o token já!)"; wc -l achados.txt; exit 1; fi
          echo "✅ histórico limpo"
      - name: Pacotes com falha de segurança conhecida (vírus/backdoor/CVE)
        run: pip-audit -r requirements.txt --strict
      - name: Código Python com padrão perigoso
        run: bandit -q -r . -x ./tests,./videos -ll -ii
      - name: Avisar o admin no Telegram se algo falhar
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          ADMIN=$(python -c "import yaml;print((yaml.safe_load(open('config.yaml')).get('telegram') or {}).get('admin_chat') or '')")
          [ -n "$ADMIN" ] && [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$ADMIN" \
            --data-urlencode "text=🚨 Montop: a varredura de segurança achou um problema. Veja em github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
