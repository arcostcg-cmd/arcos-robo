name: Teste - fontes de notícias
on:
  workflow_dispatch: {}
jobs:
  fontes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pillow
      - name: Testar cada fonte
        run: python arcos.py noticias fontes 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
