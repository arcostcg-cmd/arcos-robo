- id: one-ring-unica
  jogo: Magic
  titulo: "Uma carta, uma única cópia no mundo"
  texto: "O Um Anel (The One Ring) da coleção O Senhor dos Anéis de Magic, de 2023, teve uma única cópia impressa. Foi encontrada por um jogador e comprada pelo cantor Post Malone. Era avaliada em até US$ 2 milhões; o valor pago não foi divulgado oficialmente."
  fonte_nome: "NPR"
