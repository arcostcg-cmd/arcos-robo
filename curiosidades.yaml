- id: mtg-primeiro-tcg
  jogo: Magic
  titulo: "O primeiro TCG moderno"
  texto: "Magic: The Gathering é reconhecido pelo Guinness como o primeiro jogo de cartas colecionáveis moderno. Criado pelo professor de matemática Richard Garfield, foi lançado pela Wizards of the Coast em 5 de agosto de 1993."
  fonte_nome: "Guinness World Records"
  fonte_url: "https://www.guinnessworldrecords.com/world-records/first-modern-trading-card-game"
  verificado_em: "2026-10-31"
  busca_imagem: "Magic The Gathering cards"

- id: pikachu-illustrator-recorde
  jogo: Pokémon
  titulo: "A carta Pokémon mais cara da história"
  texto: "Em fevereiro de 2026, um Pikachu Illustrator nota PSA 10 foi vendido por US$ 16,49 milhões em leilão da Goldin. Quem vendeu foi Logan Paul, que tinha comprado a mesma carta em 2021 por US$ 5,275 milhões. É recorde do Guinness."
  fonte_nome: "Guinness World Records"
  fonte_url: "https://guinnessworldrecords.com/world-records/452634-most-expensive-pokemon-trading-card-sold-at-auction"
  verificado_em: "2026-10-31"
  busca_imagem: "Pokémon trading cards"

- id: pikachu-illustrator-origem
  jogo: Pokémon
  titulo: "A carta que nunca foi vendida em loja"
  texto: "O Pikachu Illustrator foi desenhado por Atsuko Nishida, creditada como criadora original do Pikachu. A carta nunca foi vendida: foi entregue apenas como prêmio de um concurso de ilustração em 1998."
  fonte_nome: "Guinness World Records"
  fonte_url: "https://guinnessworldrecords.com/world-records/452634-most-expensive-pokemon-trading-card-sold-at-auction"
  verificado_em: "2026-10-31"
  busca_imagem: "Pokémon trading cards"

- id: pokemon-85-bilhoes
  jogo: Pokémon
  titulo: "85 bilhões de cartas"
  texto: "Até 31 de março de 2026, já tinham sido produzidas mais de 85 bilhões de cartas de Pokémon TCG, vendidas em mais de 90 países e regiões. Só no último ano fiscal foram cerca de 10 bilhões."
  fonte_nome: "The Pokémon Company, via PokeGuardian"
  fonte_url: "https://www.pokeguardian.com/3191786_pokemon-cards-continue-strong-sales-as-total-production-hits-85-billion"
  verificado_em: "2026-10-31"
  busca_imagem: "Pokémon Trading Card Game"

- id: yugioh-guinness
  jogo: Yu-Gi-Oh!
  titulo: "Recorde mundial de vendas"
  texto: "Em 2009, o Guinness reconheceu Yu-Gi-Oh! como o jogo de cartas colecionáveis mais vendido do mundo, com mais de 22 bilhões de cartas. Em março de 2011, a Konami já falava em 25,2 bilhões desde 1999."
  fonte_nome: "Wikipédia (Yu-Gi-Oh! Trading Card Game)"
  fonte_url: "https://en.wikipedia.org/wiki/Yu-Gi-Oh!_Trading_Card_Game"
  verificado_em: "2026-10-31"
  busca_imagem: "Yu-Gi-Oh! Trading Card Game"

- id: yugioh-tokyo-dome
  jogo: Yu-Gi-Oh!
  titulo: "O evento que virou tumulto"
  texto: "Em agosto de 1999, um evento de Yu-Gi-Oh! no Tokyo Dome reuniu mais de 55 mil pessoas. A Konami cancelou no meio, houve tumulto e a polícia precisou ser chamada."
  fonte_nome: "Wikipédia (Yu-Gi-Oh! Trading Card Game)"
  fonte_url: "https://en.wikipedia.org/wiki/Yu-Gi-Oh!_Trading_Card_Game"
  verificado_em: "2026-10-31"
  busca_imagem: "Tokyo Dome"

- id: yugioh-falsificacao-upper-deck
  jogo: Yu-Gi-Oh!
  titulo: "Quando a própria distribuidora falsificou cartas"
  texto: "Em 2008, a Konami processou a Upper Deck, então distribuidora de Yu-Gi-Oh! no Ocidente, por cartas falsificadas. Em 2009, a Justiça responsabilizou a Upper Deck pela falsificação. Por isso vale sempre comprar de loja confiável."
  fonte_nome: "Wikipédia (Yu-Gi-Oh! Trading Card Game)"
  fonte_url: "https://en.wikipedia.org/wiki/Yu-Gi-Oh!_Trading_Card_Game"
  verificado_em: "2026-10-31"
  busca_imagem: "Yu-Gi-Oh! Trading Card Game"

