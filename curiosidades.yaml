  texto: "O One Piece Card Game, da Bandai, saiu no Japão em 8 de julho de 2022 e no mundo em 2 de dezembro de 2022. Os recursos ficam num baralho separado de cartas DON!!, para o jogador não comprar cartas inúteis no meio da partida."
