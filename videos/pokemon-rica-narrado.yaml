legenda: |
  💰 Como Pokémon virou a franquia que mais faturou na história?

  ▪️ Cerca de US$ 99 bilhões em 30 anos (estimativa)
  ▪️ Mais que Mickey (US$ 61 bi) e Ursinho Pooh (US$ 49 bi)
  ▪️ A The Pokémon Company (1998) cuida da marca. Nintendo tem 32%; Game Freak e Creatures são os outros donos
  ▪️ Só em 2023: US$ 10,8 bi em produtos licenciados
  ▪️ Mais de 85 bilhões de cartas impressas; cerca de 10 bi só no último ano fiscal
  ▪️ Jogo, anime, cartas e filmes lançados juntos: a estratégia "media mix"

  💬 Qual desses segredos te surpreendeu mais?
  🔖 Salva e manda pro amigo que ainda acha que é "só desenho"

